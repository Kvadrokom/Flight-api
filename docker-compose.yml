services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: flight-api:latest
    container_name: flight-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    mem_limit: 512m
    memswap_limit: 768m
    cpus: "0.8"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
